[project]
name = "aqi-mlops"
version = "0.1.0"
description = "AQI MLOps — Weather & Air Quality data pipeline for ML prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "awswrangler>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "scikit-optimize>=0.10.2",
    "xgboost>=3.2.0",
    "mlflow>=2.18.0",
    "jinja2>=3.1.6",
    "seaborn>=0.13.2",
]
