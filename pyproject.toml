[project]
name = "aqi-mlops"
version = "0.1.0"
description = "AQI MLOps — Weather & Air Quality data pipeline for ML prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "awswrangler>=3.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "scikit-optimize>=0.10.2",
    "xgboost>=3.2.0",
    "mlflow>=2.18.0",
    "jinja2>=3.1.6",
    "seaborn>=0.13.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
