# =============================================================================
# docker-compose.yml — AQI MLOps
#
# Local dev:    docker compose up --build
# Production:   managed by deploy/aqi-api.service (docker compose up -d)
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aqi-mlops:latest
    container_name: aqi-api

    ports:
      # Bind to localhost only — nginx proxies port 80 → 8000
      # For local dev, change to "8000:8000" to access directly
      - "127.0.0.1:8000:8000"

    env_file: .env

    volumes:
      # Model artifacts are kept on the host and mounted read-only into the container.
      # Weekly retrain writes new files here; /reload-model endpoint hot-swaps them.
      - ./ml/model-registry:/app/ml/model-registry:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:latest
    container_name: aqi-alloy
    restart: unless-stopped

    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345

    ports:
      # Alloy UI — localhost only (not exposed publicly through nginx)
      - "127.0.0.1:12345:12345"
      # OTLP receivers for traces from FastAPI
      - "127.0.0.1:4317:4317"   # gRPC
      - "127.0.0.1:4318:4318"   # HTTP

    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    env_file: .env

    depends_on:
      - api

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
