# =============================================================================
# docker-compose.yml — AQI MLOps
#
# Local dev:    docker compose up --build
# Production:   managed by deploy/aqi-api.service (docker compose up -d)
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aqi-mlops:latest
    container_name: aqi-api

    ports:
      # Bind to localhost only — nginx proxies port 80 → 8000
      # For local dev, change to "8000:8000" to access directly
      - "127.0.0.1:8000:8000"

    env_file: .env

    volumes:
      # Model artifacts are kept on the host and mounted read-only into the container.
      # Weekly retrain writes new files here; /reload-model endpoint hot-swaps them.
      - ./ml/model-registry:/app/ml/model-registry:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
