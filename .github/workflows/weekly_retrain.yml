name: Weekly Model Retrain

on:
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:
    inputs:
      lookback_weeks:
        description: 'Weeks of training data to include'
        required: false
        default: '8'

jobs:
  # ── Gate: all tests must pass before retraining ────────────────────────────
  ci-gate:
    name: CI gate (lint + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install deps (incl. dev group)
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check app/ ml/ tests/

      - name: Run inference + training-logic tests
        run: uv run pytest tests/test_inference.py tests/test_training_logic.py -v --tb=short

  # ── Retrain ────────────────────────────────────────────────────────────────
  retrain:
    name: Retrain + validate + deploy
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Run rolling retrain
        run: |
          WEEKS=${{ github.event.inputs.lookback_weeks || '8' }}
          echo "Training on last $WEEKS weeks of data"
          uv run python ml/train.py --lookback-weeks "$WEEKS"

      - name: Validate new model (smoke test)
        run: |
          uv run python - <<'EOF'
          import numpy as np
          from app.inference import load_artifacts
          model, median = load_artifacts()
          X = np.zeros((1, 12), dtype="float32")
          proba = model.predict_proba(X)
          assert proba.shape == (1, 5), f"Bad proba shape: {proba.shape}"
          assert abs(proba.sum() - 1.0) < 1e-3, f"Probs don't sum to 1: {proba.sum()}"
          assert len(median) >= 10, "Median dict too small"
          print("✓ Model smoke test passed")
          EOF

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqi-model-${{ github.run_id }}
          path: |
            ml/model-registry/model.ubj
            ml/model-registry/median.json
          retention-days: 30

      - name: Hot-reload deployed API
        if: ${{ vars.API_URL != '' }}
        run: |
          curl -sf -X POST "${{ vars.API_URL }}/reload-model" \
            && echo "✓ API reloaded" \
            || echo "⚠ Could not reach API"
